name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref cancels an in-flight run (saves the 10x-billed macOS minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deterministic TDD suite — the AuraKit SPM package's unit tests. Runs on the macOS host
  # via `swift test` (no simulator), matching the documented local workflow (.ai/docs/status.md).
  unit-tests:
    name: Unit tests (AuraKit)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Run package tests
        working-directory: AuraKit
        run: swift test

  # Compile-check the app on BOTH platforms — Aura is multiplatform, so a change can build on
  # one and break the other. Separate jobs (separate runners) also sidestep the macOS per-user
  # process limit that back-to-back local xcodebuild runs hit (.ai/docs/status.md).
  build:
    name: Build app (${{ matrix.platform.name }})
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: iOS, destination: 'generic/platform=iOS Simulator' }
          - { name: macOS, destination: 'generic/platform=macOS' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      # Build unsigned — a compile-check needs no signed binary, and the runner has no signing
      # identity (the native macOS build otherwise fails resolving a "Mac Development" cert; the
      # iOS Simulator build never signs, so these settings are a harmless no-op there).
      - name: Build
        run: xcodebuild build -scheme Aura -destination '${{ matrix.platform.destination }}' -quiet CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  # Liquid-Glass screenshot tests (app-hosted AuraTests target, iOS-only). Isolated on purpose:
  # the reference PNGs are recorded locally and their rendering is environment-sensitive
  # (precision 0.98 / perceptualPrecision 0.95) — keeping them in their own job means a snapshot
  # diff never masks a real unit/build failure. If the runner's rendering drifts past tolerance,
  # re-record baselines locally (see /build-test) and commit. This job GATES the PR.
  snapshot-tests:
    name: Snapshot tests (iOS)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      # snapshot-testing pulls swift-syntax (a heavy macro dependency); cache the resolved
      # source clones keyed on the committed pins. The app/unit jobs need no cache — AuraKit
      # has zero external dependencies; only AuraTests links snapshot-testing.
      - name: Cache SwiftPM source packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Aura.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      # NOTE: DerivedData is deliberately NOT cached — measured, it is a net loss. See decisions.md.
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme Aura -clonedSourcePackagesDirPath SourcePackages
      # Resolve the target simulator and start it booting here — after the cache restore, before the
      # build. A cold iOS 26 boot + app install measured 2-6 minutes, and a plain `xcodebuild test`
      # pays that *serially, after the build*, which made it the single largest slice of this job.
      # `simctl boot` returns as soon as the boot begins, so the device comes up while the app
      # compiles and `bootstatus` below merely joins it.
      #
      # Deliberately NOT first in the job: booting is heavily I/O-bound and starves the concurrent
      # cache extraction. With the boot ahead of it the SwiftPM restore measured 91-249s against 6s
      # on an unmodified `main` run — the contention gave back most of what the overlap won. The
      # ~2min build is enough runway to hide the boot without fighting the cache for disk.
      #
      # This also fails early with a readable message if the expected simulator is missing on this
      # image release (iOS 26 devices have had transient per-release gaps on the hosted runner).
      - name: Resolve the target simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          raw = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              check=True, capture_output=True, text=True,
          ).stdout
          devices = json.loads(raw)["devices"]

          def version(runtime):
              return [int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-")]

          def fail(message):
              # Workflow commands are read from stdout, so annotate there rather than via stderr.
              print(f"::error::{message}")
              sys.exit(1)

          runtimes = sorted((r for r in devices if "SimRuntime.iOS-26" in r), key=version)
          if not runtimes:
              fail("No iOS 26 simulator runtime available on this runner image")
          # Newest iOS 26.x first, matching the `OS=latest` this replaces.
          for runtime in reversed(runtimes):
              for device in devices[runtime]:
                  if device["name"] == "iPhone 17":
                      print(f"Using iPhone 17 ({device['udid']}) on {runtime}")
                      with open(os.environ["GITHUB_ENV"], "a") as env:
                          env.write(f"SIMULATOR_UDID={device['udid']}\n")
                      sys.exit(0)
          fail("iPhone 17 simulator not available on this runner image")
          PY
      - name: Start booting the simulator
        # Returns as soon as the boot begins; non-zero only if it is already booted, which is a fine
        # state to proceed from. `bootstatus` further down joins the boot before the tests run.
        run: xcrun simctl boot "$SIMULATOR_UDID" || true
      # Split from the run below so the compile overlaps the simulator boot. Built against the
      # generic simulator destination so this step never touches (or waits on) the booting device.
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme Aura \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            COMPILER_INDEX_STORE_ENABLE=NO
      # Join the boot started at the top of the job. Usually already finished by now.
      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Run snapshot tests
        run: |
          xcodebuild test-without-building \
            -scheme Aura \
            -only-testing:AuraTests \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages
      # On a mismatch the suite writes each freshly-rendered screen to AuraTests/__SnapshotFailures__/
      # (SnapshotSupport.swift pins SNAPSHOT_ARTIFACTS there). Pair each with its committed baseline and
      # emit a small self-contained HTML report — expected vs actual side by side plus an in-browser
      # difference blend — so a red is reviewable by eye. This replaces uploading the whole ~60 MB
      # .xcresult (hundreds of opaque files); the fix stays the same: inspect, then re-record baselines
      # locally — never on CI.
      - name: Build snapshot diff report
        if: failure()
        run: |
          python3 .github/scripts/snapshot-report.py \
            AuraTests/__SnapshotFailures__ \
            AuraTests/__Snapshots__ \
            snapshot-report
      - name: Upload snapshot diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: snapshot-report
          retention-days: 7
          if-no-files-found: warn
