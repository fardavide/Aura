name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref cancels an in-flight run (saves the 10x-billed macOS minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deterministic TDD suite — the AuraKit SPM package's unit tests. Runs on the macOS host
  # via `swift test` (no simulator), matching the documented local workflow (.ai/docs/status.md).
  unit-tests:
    name: Unit tests (AuraKit)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Test CI environment selection
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Run package tests
        working-directory: AuraKit
        run: swift test

  # Compile-check the app on BOTH platforms — Aura is multiplatform, so a change can build on
  # one and break the other. Separate jobs (separate runners) also sidestep the macOS per-user
  # process limit that back-to-back local xcodebuild runs hit (.ai/docs/status.md).
  build:
    name: Build app (${{ matrix.platform.name }})
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: iOS, destination: 'generic/platform=iOS Simulator' }
          - { name: macOS, destination: 'generic/platform=macOS' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      # Build unsigned — a compile-check needs no signed binary, and the runner has no signing
      # identity (the native macOS build otherwise fails resolving a "Mac Development" cert; the
      # iOS Simulator build never signs, so these settings are a harmless no-op there).
      - name: Build
        run: xcodebuild build -scheme Aura -destination '${{ matrix.platform.destination }}' -jobs 4 -quiet CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  minimum-ios:
    name: Compatibility (iOS 26)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Provision iOS 26 on the temporary runner
        id: simulator
        run: bash .github/scripts/prepare-minimum-ios-simulator.sh
      - name: Build the app for iOS 26
        run: |
          xcodebuild build -scheme Aura \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.simulator_id }},OS=26.0' \
            -derivedDataPath MinimumIosApp -jobs 4 -quiet \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Install and launch the Xcode 27-built app on iOS 26
        run: |
          xcrun simctl install '${{ steps.simulator.outputs.simulator_id }}' MinimumIosApp/Build/Products/Debug-iphonesimulator/Aura.app
          xcrun simctl launch '${{ steps.simulator.outputs.simulator_id }}' "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' MinimumIosApp/Build/Products/Debug-iphonesimulator/Aura.app/Info.plist)"
      - name: Diagnose live-player tests on iOS 26
        working-directory: AuraKit
        run: |
          xcodebuild test -scheme AuraKitTests \
            -only-testing:CommonPlayerTests/LivePlayerModelTests \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.simulator_id }},OS=26.0' \
            -jobs 4 -parallel-testing-enabled NO -collect-test-diagnostics never \
            -resultBundlePath ../MinimumIosLiveDiagnostic.xcresult
      - name: Run package tests on iOS 26
        working-directory: AuraKit
        run: |
          xcodebuild test -scheme AuraKitTests \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.simulator_id }},OS=26.0' \
            -jobs 4 -parallel-testing-enabled NO \
            -resultBundlePath ../MinimumIosPackageResults.xcresult
      - name: Retain iOS 26 test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-ios-package-results
          path: |
            MinimumIosPackageResults.xcresult
            MinimumIosLiveDiagnostic.xcresult
          retention-days: 7
          if-no-files-found: warn

  # Liquid-Glass screenshot tests (app-hosted AuraTests target, iOS-only). Isolated on purpose:
  # the reference PNGs are recorded locally and their rendering is environment-sensitive
  # (precision 0.98 area budget / perceptualPrecision 0.87 = ΔE 13 — see decisions.md) — keeping them in their own job means a snapshot
  # diff never masks a real unit/build failure. If the runner's rendering drifts past tolerance,
  # re-record baselines locally (see /build-test) and commit. This job GATES the PR.
  snapshot-tests:
    name: Snapshot tests (iOS)
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      # snapshot-testing pulls swift-syntax (a heavy macro dependency); cache the resolved
      # source clones keyed on the committed pins. The app/unit jobs need no cache — AuraKit
      # has zero external dependencies; only AuraTests links snapshot-testing.
      - name: Cache SwiftPM source packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Aura.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme Aura -clonedSourcePackagesDirPath SourcePackages
      # Bind the test-owned iPhone 17 to the exact runtime and wait for first boot to finish.
      - name: Prepare iOS 27 snapshot simulator
        id: simulator
        run: bash .github/scripts/prepare-snapshot-simulator.sh
      - name: Run snapshot tests
        run: |
          xcodebuild test \
            -scheme Aura \
            -only-testing:AuraTests \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.simulator_id }},OS=27.0' \
            -jobs 4 \
            -parallel-testing-enabled NO \
            -resultBundlePath SnapshotResults.xcresult \
            -clonedSourcePackagesDirPath SourcePackages
      # On a mismatch the suite writes each freshly-rendered screen to AuraTests/__SnapshotFailures__/
      # (SnapshotSupport.swift pins SNAPSHOT_ARTIFACTS there). Pair each with its committed baseline and
      # emit a small self-contained HTML report — expected vs actual side by side plus an in-browser
      # difference blend — so a mismatch is reviewable by eye. Re-record baselines locally, never
      # on CI. Runtime failures also retain the result bundle below because they may produce no PNG.
      - name: Build snapshot diff report
        if: failure()
        run: |
          python3 .github/scripts/snapshot-report.py \
            AuraTests/__SnapshotFailures__ \
            AuraTests/__Snapshots__ \
            snapshot-report
      - name: Upload snapshot diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: snapshot-report
          retention-days: 7
          if-no-files-found: warn
      # Runtime exits can leave no PNG diffs; preserve the crash and timeout diagnostics too.
      - name: Upload snapshot runtime diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-results
          path: SnapshotResults.xcresult
          retention-days: 7
          if-no-files-found: warn
