name: Select Xcode
description: >
  Activate Xcode 27.0 build 27A266a on the runner and reject a missing or different installation.
  The toolchain and snapshot references are migrated together. Requires checkout first.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        bash .github/scripts/select-xcode.sh
        xcrun swift --version
        sw_vers
        printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
